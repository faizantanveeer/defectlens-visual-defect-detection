[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-detection"
version = "1.0.0"
description = "Production visual defect detection: normal vs defective product classification with an ONNX inference API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faizan Tanveer" }]

# Core = serving runtime only. Kept deliberately small so the API image
# carries onnxruntime and no deep-learning framework.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "torchvision>=0.18",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "tabulate>=0.9",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
vdd = "defect_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's File(...) defaults
